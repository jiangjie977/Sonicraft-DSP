name: host-harness

# DSP 主机回归：不需要 Android SDK / 设备，直接编译 core/dsp 的纯算法并跑断言。
# 断言全部通过返回 0，任一失败返回 1（见 tools/host-harness/main.cpp 末尾）。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  dsp-regression:
    name: DSP regression (Windows / MSVC)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S tools/host-harness -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run assertions
        run: .\build\host_harness.exe
