name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  host-dsp-harness:
    name: Host DSP harness (PC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tools/host-harness -B tools/host-harness/build -G Ninja
      - name: Build
        run: cmake --build tools/host-harness/build
      - name: Run
        run: ./tools/host-harness/build/host_harness

  android-build:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build
        run: ./gradlew assembleDebug --no-daemon
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
