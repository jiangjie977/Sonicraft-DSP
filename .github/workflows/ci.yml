name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

# 同一分支的新推送取消旧跑，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-dsp-harness:
    name: Host DSP harness (PC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tools/host-harness -B tools/host-harness/build -G Ninja
      - name: Build
        run: cmake --build tools/host-harness/build
      - name: Run
        run: ./tools/host-harness/build/host_harness

  android-build:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 不再用 android-actions/setup-android：它已停更，且会在 sdkmanager 许可环节失败。
      # ubuntu-latest 镜像自带 Android SDK / cmdline-tools / NDK，许可已预接受，
      # 这里只做一次环境自检，缺什么一眼能看出来。
      - name: Android SDK 环境自检
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          echo "--- NDK ---"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(无 ndk 目录)"
          echo "--- 构建工具 ---"
          cmake --version | head -1
          ninja --version
          java -version 2>&1 | head -2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Build (assembleDebug)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
